# The HackWin configuration of this project (hackwin.yml).
# Written by `hackwin setup`. The Lead changes it only through a pull request; hooks, CI and
# the Gate always read it from the default branch on GitHub.

schema: 1
cli_version: 0.1.0-pre.1
project:
  default_branch: main
  language: en
  event:
    start: 2026-10-24T09:00:00+02:00
    end: 2026-10-25T15:00:00+02:00
team:
  lead: Bartek201301
  members:
    - name: Lead
      github: Bartek201301
      roles:
        - shared
      agent: claude
      sessions: 2
    - name: Builder One
      github: test-bot-builder
      roles:
        - counter
        - todos
      agent: codex
      sessions: 2
    - name: Builder Two
      github: maljul
      roles:
        - greeting
      agent: claude
      sessions: 2
commands:
  install: node -e 0
  check: node -e 0
  test: node
  format: node -e 0
  generate: node -e "const f=require('fs');if(f.existsSync('src/shared/words/source.txt'))f.writeFileSync('src/shared/words/generated.txt',f.readFileSync('src/shared/words/source.txt','utf8').toUpperCase())"
  lockfile_regen: npm install --package-lock-only
  smoke: null
paths:
  contracts:
    - src/shared/**
  generated:
    - src/shared/words/generated.txt
  manifests:
    - package.json
  lockfiles:
    - package-lock.json
  gated:
    migrations: []
    production_config: []
  ledger: null
tasks:
  max_files: 10
gate:
  poll_seconds: 10
  ci_rerun_limit: 1
  repeated_failure_threshold: 2
  heartbeat_stale_seconds: 300
  status_issue_seconds: 120
  ci_timeout_minutes: 20
  step_timeout_minutes: 20
  known_flaky_tests: []
  secret_patterns:
    - hwtest_[a-z0-9]{24}
resolver:
  enabled: false
  model: null
  max_turns: 30
